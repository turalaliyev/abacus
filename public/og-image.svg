<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Abacus Audit &amp; Consulting">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2340"/>
      <stop offset="1" stop-color="#071525"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 90h1200M0 180h1200M0 270h1200M0 360h1200M0 450h1200M0 540h1200"/>
    <path d="M100 0v630M200 0v630M300 0v630M400 0v630M500 0v630M600 0v630M700 0v630M800 0v630M900 0v630M1000 0v630M1100 0v630"/>
  </g>

  <!-- mark -->
  <rect x="88" y="86" width="96" height="96" rx="20" fill="#d4af37"/>
  <text x="136" y="153" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#071525" text-anchor="middle">A</text>

  <!-- wordmark -->
  <text x="208" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#ffffff">Abacus</text>
  <text x="208" y="176" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" letter-spacing="4" fill="#d4af37">AUDIT &amp; CONSULTING</text>

  <!-- headline -->
  <text x="88" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#ffffff">Audit, vergi və</text>
  <text x="88" y="412" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#ffffff">mühasibatlıq xidmətləri</text>

  <rect x="88" y="452" width="120" height="5" rx="2.5" fill="#d4af37"/>

  <!-- trust line -->
  <text x="88" y="524" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#94a3b8">Auditorlar Palatasının üzvü · Lisenziya AT/135 · 2017-ci ildən</text>
  <text x="88" y="568" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">abacusaudit.az · Bakı</text>
